name: Publish NPM

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x, 24.x]
        eslint: [9, 10]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ESLint 9 comes from the lockfile; other majors are swapped in on top
      - name: Install ESLint ${{ matrix.eslint }}
        if: matrix.eslint != 9
        run: npm install --no-save --ignore-scripts eslint@${{ matrix.eslint }}

      - name: Lint
        run: npm run lint

      - name: Test configs
        run: npm test

  publish-npm:
    needs: lint
    runs-on: ubuntu-latest

    # Only the publish job can mint the OIDC token used by npm
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Update npm
        run: npm install -g npm@latest

      - run: npm ci

      - run: npm publish --access=public
